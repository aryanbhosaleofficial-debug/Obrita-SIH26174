# Module 03 demo defaults, configurable and not performance-validated.
hand_tracker:
  enabled: true
  backend: mediapipe
  model_path: ../models/hand_landmarker.task
  max_hands: 2
  min_detection_confidence: 0.5
  min_presence_confidence: 0.5
  min_tracking_confidence: 0.5
  mirrored: false
reference_frame:
  enabled: true
  type: aruco
  reference_id: rack_markers_0_1_2_3
  aruco_dictionary: DICT_4X4_50
  marker_ids: [0, 1, 2, 3]
interaction:
  context_classes: [rack, experiment_board, payload]
  leaving_window_ms: 500
  motion_speed_threshold: 0.02
  rack_relative:
    proximity_threshold: 0.08
    contact_threshold: 0.03
    ambiguity_margin: 0.01
    trend_speed_threshold: 0.05
  image_diagonal:
    proximity_threshold: 0.06
    contact_threshold: 0.02
    ambiguity_margin: 0.008
    trend_speed_threshold: 0.04
stabilization:
  detection_min_frames: 3
  interaction_min_frames: 4
  max_missing_frames: 2
  ema_alpha: 0.5
  matching_iou_threshold: 0.3
  hand_matching_distance: 0.1
  max_time_gap_s: 1.0
debug:
  draw_detections: true
  draw_hands: true
