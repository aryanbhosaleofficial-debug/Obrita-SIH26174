# =============================================================================
# boundary.yaml — Module 04 Boundary Detection
#
# PLACEHOLDER CONFIGURATION. Segmentation ranges and thresholds depend on the
# real objects, background and lighting of the demo setup and must be tuned
# there. Nothing below is a validated value.
# =============================================================================

input:
  # Skip boundary analysis when Module 03 quality_ok is false.
  require_optimization_quality: true

roi:
  padding_ratio: null      # fraction of target bbox size added on each side
  include_hands: true      # extend ROI to include hand landmarks near the target

preprocessing:
  blur_kernel: null        # odd integer, null = no blur
  illumination:
    method: null           # e.g. none / histogram-equalization variant, chosen on demo footage
    params: {}

segmentation:
  method: null             # "hsv" or another foreground method
  hsv:
    # Per-class HSV ranges: {class_name: {lower: [h, s, v], upper: [h, s, v]}}
    ranges: {}

morphology:
  open_kernel: null
  close_kernel: null
  iterations: null
  min_component_area_px: null

contour:
  min_area_px: null
  max_area_px: null
  min_perimeter_px: null
  # Resampled contour length (points) or spacing; set exactly one.
  resample_points: null
  resample_spacing_px: null

chain_code:
  connectivity: 8          # Freeman chain code connectivity (4 or 8)
  normalize_start_point: true
  use_differential: true

features:
  contact_distance_px: null      # hand-landmark to boundary distance treated as contact evidence

temporal:
  history_frames: null
  stationary_tolerance: null     # centroid / orientation change below which state = stationary
  rotation_threshold_deg: null   # rack-relative rotation threshold
  confirmation_min_hits: null
  confirmation_window: null

crosscheck:
  enabled: true

quality:
  require_valid_rack_reference: true
