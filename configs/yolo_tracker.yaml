# Local ByteTrack settings; appearance models/ReID and downloads are disabled.
tracker_type: bytetrack
track_high_thresh: 0.5
track_low_thresh: 0.1
# Keep new-track eligibility aligned with yolo.yaml confidence_threshold (0.50).
# Logical consistency only; this is not an experimentally tuned threshold.
new_track_thresh: 0.5
track_buffer: 30
match_thresh: 0.8
fuse_score: true
with_reid: false
