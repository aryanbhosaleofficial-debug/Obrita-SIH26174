# =============================================================================
# fusion.yaml — Module 05 Perception Fusion
#
# PLACEHOLDER CONFIGURATION. Weights and thresholds are null until chosen and
# validated on recorded demo sessions. Nothing below is a validated value.
# =============================================================================

input:
  # Maximum allowed timestamp difference (s) between paired packets that share a frame_id.
  # Used only as a consistency check; frame_id is the primary key.
  max_timestamp_mismatch_s: null
  # Allow fusion when the BoundaryOutputPacket for a frame is missing.
  allow_missing_boundary: false
  # Packets with these statuses are rejected.
  reject_statuses: [error, invalid_input]

evidence:
  # Minimum per-source confidence for evidence to be used: {source: threshold}
  min_confidence:
    object: null
    gesture: null
    interaction: null
    motion: null
    contact: null
    boundary: null

confidence:
  method: null              # fusion method, e.g. weighted / rule-based; chosen during implementation
  weights:
    object: null
    gesture: null
    interaction: null
    motion: null
    contact: null
    boundary: null
  # Missing evidence is treated as "unknown", not as negative evidence.
  missing_evidence_policy: unknown
  min_event_confidence: null

conflict_resolution:
  # Policy when Module 03 and Module 04 disagree, e.g. "prefer_confirmed", "mark_uncertain".
  policy: null
  record_conflicts: true

temporal:
  window_frames: null
  confirmation_min_hits: null
  confirmation_window: null
  # Frames without support before an ongoing activity is considered ended.
  end_gap_frames: null

activities:
  # Configurable activity label set; must match expected_activity values in procedures/*.yaml.
  labels:
    - unknown
    - PLACEHOLDER_ACTIVITY
    - PLACEHOLDER_ACTIVITY_2

output:
  events_dir: outputs/events
