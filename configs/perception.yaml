# Real inference: paths are relative to THIS config file. No runtime downloads.
perception:
  preprocessing:
    max_width: null
    equalize_luminance: false
  detector:
    backend: ultralytics
    model_path: ../02_yolo/models/experiment_objects.pt
    confidence_threshold: 0.50
    iou_threshold: 0.45
    class_whitelist: null
    device: auto
    cpu_fallback: true
    tracking: false
    tracker_path: ../configs/perception_tracker.yaml
  hand_tracker:
    enabled: true
    backend: mediapipe
    model_path: ../models/hand_landmarker.task
    max_hands: 2
    min_detection_confidence: 0.50
    min_presence_confidence: 0.50
    min_tracking_confidence: 0.50
  reference_frame:
    type: manual
    enabled: false
    reference_id: rack_calibration_1
    corners_normalized: null
    # Enable only after measuring four physical rack corners in this order:
    # origin, +x, +x/+y, +y. Do NOT sort corners by camera vertical direction.
  interaction:
    proximity_threshold: 0.08
    contact_threshold: 0.03
    ambiguity_margin: 0.01
    trend_threshold: 0.005
    motion_speed_threshold: 0.02
  stabilization:
    detection_min_frames: 3
    interaction_min_frames: 4
    max_missing_frames: 2
    ema_alpha: 0.5
    matching_iou_threshold: 0.3
    hand_matching_distance: 0.1
    max_time_gap_s: 1.0
  debug:
    draw_detections: true
    draw_hands: true
    draw_reference_axes: true
    draw_associations: true
    draw_warnings: true
