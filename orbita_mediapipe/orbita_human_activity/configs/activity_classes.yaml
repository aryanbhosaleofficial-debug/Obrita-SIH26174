# ==============================================================================
# ORBITA: On-Board BAS Experiment Human Activity Classes
# ==============================================================================
activity_classes:
  0: "IDLE_MONITORING"       # Operator standing/floating neutrally observing instruments
  1: "RACK_INSPECTION"       # Visual inspection with hands near rack panels / displays
  2: "SWITCH_ACTUATION"      # Targeted reaching and manipulation of toggles, switches, dials
  3: "CABLE_ROUTING"         # Two-handed manipulation, tracing harnesses across bay
  4: "EQUIPMENT_MAINTENANCE" # Tools handling, module replacement, fastener tightening
  5: "EMERGENCY_SHUTDOWN"    # Rapid reach to emergency stop / cut-off breakers

metadata:
  num_classes: 6
  version: "1.0.0"
  notes: "Class labels tailored to astronaut/operator actions at microgravity Bio-Astro Science (BAS) racks."
