# =============================================================================
# demo_experiment.yaml — EXAMPLE CONFIGURATION ONLY
#
# This file illustrates the procedure schema consumed by procedure/procedure_loader.py.
# It is NOT a real ISRO / BAS experiment procedure. Replace every PLACEHOLDER
# value with the team's actual demo procedure.
#
# Field meanings:
#   experiment.id          unique id of the procedure
#   experiment.name        human-readable name
#   steps[].id             unique step id (order in this list = expected order)
#   steps[].description    text shown to the operator as next-step guidance
#   steps[].expected_activity  must be a label from configs/fusion.yaml activities.labels
#   steps[].target_object      must be a class name from configs/classes.yaml
#   steps[].optional           optional steps may be skipped without a SKIPPED outcome
# =============================================================================

experiment:
  id: "demo_experiment"
  name: "Configurable Demo Experiment"
  version: "0.0-example"

steps:
  - id: "step_01"
    description: "Describe the first operator action"
    expected_activity: "PLACEHOLDER_ACTIVITY"
    target_object: "PLACEHOLDER_OBJECT"
    optional: false

  - id: "step_02"
    description: "Describe the second operator action"
    expected_activity: "PLACEHOLDER_ACTIVITY_2"
    target_object: "PLACEHOLDER_OBJECT_A"
    optional: false
